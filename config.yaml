profiling:
  ewma_alpha: 0.35
  confidence_events: 30
  weights:
    onset: 0.45
    length: 0.25
    frequency: 0.20
    grammatical_class: 0.10
  detection:
    repetition_window: 2
    prolongation_percentile: 90
    prolongation_min_seconds: 1.0
    block_gap_seconds: 0.55
    near_repetition_similarity: 0.75
    # Words this short or shorter are compared by pronunciation (ARPAbet phoneme
    # distance) rather than spelling, where one changed letter swamps the edit
    # ratio. Longer / out-of-vocabulary words keep the spelling metric.
    phonetic_short_max_chars: 4
    phrase_repetition_min_words: 2
    # Longest repeated phrase to scan for (e.g. "I want to I want to"). Raised
    # from the old hard-coded 2-3 word limit; capped here to bound the scan.
    phrase_repetition_max_words: 8
    # Confidence bonus applied to disfluencies at sentence-initial position.
    # Stuttering is overwhelmingly sentence-initial, so events there are
    # clinically more significant and get a small confidence boost.
    sentence_initial_boost: 0.08
    filler_words:
      - uh
      - um
      - er
      - erm
      - like
    # Which named detectors run. Config-driven extensibility hook: adding a
    # future detector is a registration here + one function in detect.py, not
    # a rewrite of its control flow. All on by default.
    detectors:
      - filler
      - stutter_marker
      - phrase_repetition
      - word_repetition
      - sound_repetition
      - block
      - prolongation
      - acoustic_fusion
    # Per-source confidence weighting used only where two sources compete for
    # the same (index, type) — currently just the acoustic-native detector
    # vs. the token-path detector on block/prolongation. The acoustic
    # candidate only replaces the token-path event when its weighted
    # confidence is STRICTLY higher; on a tie the token-path event is kept
    # (it carries word-level grounding audio alone doesn't have). Raise
    # "acoustic" above 1.0 to trust the audio-native signal more; this does
    # not affect anything when no audio is provided.
    fusion_weights:
      rule: 1.0
      acoustic: 1.0
    acoustic:
      # RMS energy below this = silence (confirms blocks are real, not ASR gaps)
      # Raise if background noise is suppressing real blocks.
      silence_rms_threshold: 0.015
      # RMS above this = speaker is producing sound (confirms prolongation)
      voiced_rms_threshold: 0.030
      # Zero-crossing rate below this = voiced sound (vowel/sonorant).
      # High ZCR = unvoiced consonant or noise — not clinically meaningful prolongation.
      voiced_zcr_threshold: 0.15
      # Silero VAD (a small pretrained real-speech voice-activity model) gates
      # acoustic-native prolongation confidence: a voiced-by-RMS segment that
      # VAD does NOT confirm as real speech gets down-weighted, not rejected.
      # Automatically a no-op on any clip where VAD finds no speech at all
      # (e.g. synthetic test tones) — see profiling/acoustic.py's module note.
      use_vad: true
      vad_min_coverage: 0.30
      # Praat-derived voice-quality corroboration for prolongation: a
      # genuinely sustained vowel has stable pitch and low jitter/shimmer.
      # None of these ever REJECT a candidate the RMS/ZCR gate already
      # passed — they only adjust confidence up or down.
      use_praat: true
      jitter_max: 0.02
      shimmer_max: 0.08
      pitch_std_max_hz: 25.0
      min_praat_segment_seconds: 0.15
rewrite:
  lambda: 0.55
  mu: 0.12
  tau: 0.80
  top_k: 12
  risk_threshold: 0.55
  min_improvement: 0.01
  lambda_sweep:
    - 0.0
    - 0.25
    - 0.5
    - 0.75
    - 1.0
eval:
  output_dir: outputs
